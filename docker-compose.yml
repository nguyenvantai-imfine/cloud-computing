networks:
  cloud-net:
    name: cloud-net
    ipam:
      config:
        - subnet: 10.10.10.0/24
          ip_range: 10.10.10.128/25

volumes:
  db-data-v2:
  keycloak-data:
  prometheus-data:
  grafana-data:

services:
  web-frontend-server:
    build: ./web-frontend-server
    image: ${DOCKERHUB_USER:-nguyenvantai1702}/myminicloud-web:dev
    container_name: web-frontend-server
    hostname: web-frontend-server1
    networks:
      cloud-net:
        ipv4_address: 10.10.10.10
        aliases:
          - web-frontend-server1
    ports: ["8080:80"]
    restart: unless-stopped

  web-frontend-server2:
    build: ./web-frontend-server
    image: ${DOCKERHUB_USER:-nguyenvantai1702}/myminicloud-web:dev
    container_name: web-frontend-server2
    hostname: web-frontend-server2
    networks:
      cloud-net:
        aliases:
          - web-frontend-server2
    ports: ["8082:80"]
    restart: unless-stopped

  web-nginx-exporter:
    container_name: web-nginx-exporter
    image: nginx/nginx-prometheus-exporter:1.5.1
    command:
      - --nginx.scrape-uri=http://web-frontend-server:8081/stub_status
    networks: [cloud-net]
    restart: unless-stopped

  application-backend-server:
    build: ./application-backend-server
    image: ${DOCKERHUB_USER:-nguyenvantai1702}/myminicloud-app:dev
    container_name: application-backend-server
    networks:
      cloud-net:
        ipv4_address: 10.10.10.20
    ports: ["8085:8081"]
    environment:
      OIDC_ISSUER: "${OIDC_ISSUER:-http://localhost/auth/realms/realm_sv001}"
      OIDC_JWKS_URL: "http://authentication-identity-server:8080/auth/realms/realm_sv001/protocol/openid-connect/certs"
      OIDC_AUDIENCE: "account"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/hello', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      relational-database-server:
        condition: service_healthy
    restart: unless-stopped

  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: minicloud
    volumes:
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
      - db-data-v2:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports: ["3306:3306"]
    networks: [cloud-net]
    restart: unless-stopped

  authentication-identity-server:
    image: quay.io/keycloak/keycloak:26.0
    container_name: authentication-identity-server
    command: ["start-dev", "--import-realm"]
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./authentication-identity-server/realm_sv001.json:/opt/keycloak/data/import/realm_sv001.json:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_PROXY_HEADERS: "xforwarded"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /auth/realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r status <&3; [[ \"$$status\" == *'200'* ]]"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 30
    ports: ["8081:8080"]
    networks:
      cloud-net:
        ipv4_address: 10.10.10.40
    restart: unless-stopped

  object-storage-server:
    build: ./object-storage-server
    image: myminicloud-minio:2025-10-15
    container_name: object-storage-server
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./object-storage-server/data:/data
    ports: ["9000:9000", "9001:9001"]
    networks:
      cloud-net:
        ipv4_address: 10.10.10.30
    restart: unless-stopped

  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    ports: ["1053:53/udp"]
    volumes:
      - ./internal-dns-server/named.conf:/etc/bind/named.conf:ro
      - ./internal-dns-server/named.conf.options:/etc/bind/named.conf.options:ro
      - ./internal-dns-server/named.conf.local:/etc/bind/named.conf.local:ro
      - ./internal-dns-server/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks:
      cloud-net:
        ipv4_address: 10.10.10.53
    restart: unless-stopped

  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    ports: ["9100:9100"]
    networks: [cloud-net]
    restart: unless-stopped

  monitoring-prometheus-server:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus-server
    ports: ["9090:9090"]
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [cloud-net]
    restart: unless-stopped

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    ports: ["3000:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring-grafana-dashboard-server/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring-grafana-dashboard-server/dashboards:/var/lib/grafana/dashboards:ro
    networks: [cloud-net]
    restart: unless-stopped

  storage-init:
    build: ./object-storage-server/bootstrap
    image: myminicloud-storage-init:dev
    container_name: storage-init
    networks: [cloud-net]
    depends_on: [object-storage-server]
    volumes:
      - ./object-storage-server/bootstrap:/bootstrap:ro
      - ./web-frontend-server/html/assets/images:/seed-images:ro
    entrypoint: ["python", "/bootstrap/init.py"]
    restart: on-failure

  api-gateway-proxy-server:
    image: nginx:stable
    container_name: api-gateway-proxy-server
    depends_on:
      web-frontend-server:
        condition: service_started
      web-frontend-server2:
        condition: service_started
      application-backend-server:
        condition: service_healthy
      authentication-identity-server:
        condition: service_healthy
    ports: ["80:80"]
    volumes:
      - ./api-gateway-proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [cloud-net]
    restart: unless-stopped
