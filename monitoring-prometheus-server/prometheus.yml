global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "node"
    static_configs:
      - targets: ["monitoring-node-exporter-server:9100"]

  - job_name: "web"
    metrics_path: /metrics
    static_configs:
      - targets: ["web-nginx-exporter:9113"]
        labels:
          frontend: "web1"
      - targets: ["web-nginx-exporter2:9113"]
        labels:
          frontend: "web2"
